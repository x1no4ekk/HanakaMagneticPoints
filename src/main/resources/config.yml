# ═══════════════════════════════════════════════════════════════════════════
#  ⚡ HanakaMagneticPoints v2.1.0 — Магнитные точки
#  Ядро: Paper 1.21.x · API: 1.21
#
#  В этом файле настраивается АБСОЛЮТНО ВСЁ: физика притяжения, защита,
#  частицы, звуки, GUI, градиент оформления и списки магнитных материалов.
#  Тексты сообщений — в файле messages.yml.
#  После правок: /magnet reload
# ═══════════════════════════════════════════════════════════════════════════

settings:
  # Радиус новых точек (блоки)
  default-radius: 12.0
  # Границы для /magnet radius
  min-radius: 3.0
  max-radius: 100.0
  # Общий множитель силы притяжения (1.0 = стандарт)
  strength-multiplier: 1.0
  # Как часто пересчитывать притяжение, в тиках (1 = каждый тик, тяжелее для TPS)
  update-interval: 2
  # Максимальная скорость, которую магнит может придать объекту (блоков/тик)
  max-velocity: 1.2
  # Ближе этого расстояния к центру притяжение прекращается
  stop-distance: 0.8
  # Автосохранение points.yml, в секундах (0 — сохранять только при выключении)
  auto-save-interval: 300
  # Миры, в которых плагин полностью отключён
  disabled-worlds: []
  # Максимум точек на сервере (0 — без ограничения)
  max-points: 0
  # Допустимые символы в названии точки (регулярное выражение)
  name-pattern: "[A-Za-zА-Яа-яЁё0-9_\\-]{1,32}"
  # Файл сообщений внутри папки плагина
  messages-file: messages.yml
  # Подробные логи в консоль
  debug: false
  # ⚡ ОПТИМИЗАЦИЯ: точка "спит", пока рядом нет игроков (блоки; 0 — считать всегда)
  activation-distance: 96.0
  # ⚡ ОПТИМИЗАЦИЯ: максимум предметов на одну точку за проход (0 — без лимита)
  max-items-per-point: 64

# ── Оформление: зелёно-лаймовый градиент ─────────────────────────
# В messages.yml используйте <g>текст</g> — обычный градиент,
# и <e>текст</e> — градиент ошибок. Доступны любые теги MiniMessage.
gradient:
  start: "#00E676"
  end: "#C6FF00"
  error-start: "#FF5252"
  error-end: "#FFD180"

# ── Притяжение предметов ────────────────────────────────────
items:
  enabled: true
  # Базовая сила рывка для предмета с весом 10
  speed: 0.09
  # Дополнительный подъём вверх, чтобы предметы не застревали в блоках
  vertical-boost: 0.02
  # Останавливать предмет, когда он долетел до центра
  freeze-at-center: true
  # Не трогать только что выброшенные предметы (у них есть задержка подбора)
  ignore-pickup-delay: false
  # ── 🧲 АНТИ-ЗАСТРЕВАНИЕ: предметы не влипают в блоки ────────────
  anti-stuck:
    # Обходить блоки на пути и вытаскивать предметы из блоков
    enabled: true
    # Как часто делать тяжёлые проверки (вытаскивание, луч видимости), в тиках
    check-interval: 10
    # Импульс вверх, чтобы перескочить блок на пути и край ступеньки
    climb-boost: 0.3
    # На сколько блоков вверх искать свободное место, если предмет уже в блоке
    unstick-height: 3
    # Сколько проверок подряд предмет должен стоять на месте, чтобы его подбросило
    stuck-checks: 4
    # Не тянуть предметы сквозь стены (точнее, но дороже для TPS)
    require-line-of-sight: false

# ── Притяжение игроков ─────────────────────────────────────
players:
  enabled: true
  speed: 0.05
  vertical-boost: 0.012
  # Что учитывать при подсчёте веса металла
  count-hands: true
  count-armor: true
  count-inventory: false
  # Умножать вес на количество предметов в стаке
  count-stack-amount: false
  # Минимальный вес, с которого игрока начинает тянуть
  min-weight: 2
  # Ограничение суммарного веса, чтобы не улетать в стену
  max-weight: 60
  # ⚡ ОПТИМИЗАЦИЯ: кэш подсчёта металла в инвентаре, в тиках (0 — считать каждый раз)
  weight-cache-ticks: 10
  action-bar:
    # 📊 Индикатор «Притяжение N ед.» в экшн-баре
    enabled: true
    # Как часто обновлять, в тиках
    interval: 10
    bar:
      enabled: true
      length: 10
      filled: "▌"
      empty: "▌"
  # 🛡 Защита от притяжения
  protection:
    sneaking: true      # крадущиеся (Shift)
    elytra: true        # полёт на элитрах
    flying: true        # режим полёта
    creative: true      # креатив
    spectator: true     # наблюдатель
    bypass-permission: "magnet.bypass"

# ── Частицы ───────────────────────────────────────────────
particles:
  enabled: true
  # ELECTRIC_SPARK, END_ROD, WAX_ON, SONIC_BOOM, CRIT, ENCHANTED_HIT, GLOW ...
  type: WAX_ON
  # Количество частиц в кольце
  count: 24
  # all — видят все, admin — только с правом magnet.particles.see, none — никто
  visibility: admin
  # Как часто рисовать кольцо, в тиках
  interval: 10
  # Вращать кольцо
  rotate: true
  # Дополнительные кольца выше основного (0 — только одно кольцо)
  rings: 1
  # Расстояние между кольцами по высоте
  ring-height: 0.7
  # Смещение кольца по высоте относительно центра точки
  vertical-offset: 0.2
  # Скорость и разброс частиц
  particle-speed: 0.0
  spread: 0.0
  # На каком расстоянии игрок видит частицы
  view-distance: 48.0
  # ✨ НЕ рисовать частицы внутри блоков (в земле, стенах, мебели)
  avoid-blocks: true
  # На сколько блоков поднять частицу на поверхность (0 — просто пропускать её)
  surface-lift: 2

# ── Звуки ─────────────────────────────────────────────────
# Можно писать как BLOCK_BEACON_AMBIENT, так и точный ключ block.note_block.bass
sounds:
  enabled: true
  ambient: BLOCK_BEACON_AMBIENT
  volume: 0.3
  pitch: 1.5
  # Интервал фонового звука, в тиках
  interval: 80
  ui:
    volume: 0.7
    pitch: 1.4
    click: UI_BUTTON_CLICK
    success: ENTITY_PLAYER_LEVELUP
    error: ENTITY_VILLAGER_NO
    delete: BLOCK_ANVIL_LAND
    teleport: ENTITY_ENDERMAN_TELEPORT

# ── GUI-панель (/magnet gui) ────────────────────────────────────
gui:
  # Количество рядов, 2–6 (последний ряд — навигация)
  rows: 6
  filler:
    enabled: true
    material: BLACK_STAINED_GLASS_PANE
  point:
    active-material: LODESTONE
    disabled-material: GRAY_DYE
  navigation:
    previous-material: ARROW
    next-material: SPECTRAL_ARROW
    close-material: BARRIER
    info-material: COMPASS
    empty-material: STRUCTURE_VOID
  # Обновлять панель после действия
  auto-refresh: true

# ── Телепортация ────────────────────────────────────────
teleport:
  # Подъём над точкой при телепорте
  offset-y: 1.0
  # Искать безопасное место, если точка внутри блоков
  safe: true

# ── ⚖️ Магнитные материалы и их вес ───────────────────────────
# Вес 10 тянет максимально сильно, вес 2 — еле-еле. Вес 0 = не притягивается.
# Поддерживаются шаблоны со звёздочкой: NETHERITE_* — всё незеритовое.
materials:
  # Вес для всего, что не попало в списки ниже
  default-weight: 0
  # Материалы-исключения: никогда не притягиваются
