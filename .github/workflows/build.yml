name: Build plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Resolve paper-api version
        id: paper
        run: |
          set +e
          RESOLVED=""
          for v in 1.21.11-R0.1-SNAPSHOT 1.21.10-R0.1-SNAPSHOT 1.21.9-R0.1-SNAPSHOT 1.21.8-R0.1-SNAPSHOT 1.21.7-R0.1-SNAPSHOT 1.21.4-R0.1-SNAPSHOT 1.21-R0.1-SNAPSHOT; do
            echo "::group::try $v"
            mvn -B -q -Dpaper.version="$v" dependency:resolve
            code=$?
            echo "::endgroup::"
            if [ "$code" -eq 0 ]; then RESOLVED="$v"; break; fi
          done
          set -e
          if [ -z "$RESOLVED" ]; then
            echo "Не удалось скачать ни одну версию paper-api" | tee build.log
            exit 1
          fi
          echo "Используем paper-api $RESOLVED"
          echo "version=$RESOLVED" >> "$GITHUB_OUTPUT"

      - name: Build with Maven
        run: |
          set -o pipefail
          mvn -B -Dpaper.version="${{ steps.paper.outputs.version }}" clean package 2>&1 | tee build.log

      - name: Show artifacts
        run: ls -lah target/*.jar

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HanakaMagneticPoints
          path: |
            target/*.jar
            build.log
          if-no-files-found: warn

      - name: Publish release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 '<version>' pom.xml | sed -E 's/.*<version>(.*)<\/version>.*/\1/')
          TAG="v$VERSION"
          gh release delete "$TAG" --yes --cleanup-tag || true
          sleep 3
          gh release create "$TAG" target/*.jar \
            --title "HanakaMagneticPoints $VERSION" \
            --notes "Автосборка из ветки main (commit ${GITHUB_SHA}). Paper API: ${{ steps.paper.outputs.version }}. Скачайте JAR ниже и положите в папку plugins/."

      - name: Report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f build.log ]; then tail -c 45000 build.log > fail.log; else echo "build.log отсутствует" > fail.log; fi
          {
            echo "Автоматический отчёт о неудачной сборке."
            echo
            echo '```'
            cat fail.log
            echo '```'
          } > body.md
          gh issue create --title "Build failed: ${GITHUB_SHA}" --body-file body.md
